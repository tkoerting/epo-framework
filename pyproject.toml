[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "epo"
version = "0.4.0"
description = "Evolutionary Prompt Optimization -- Closed-Loop Prompt-Evolution through User Feedback"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
authors = [
    {name = "Thomas Koerting"},
]
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "fastapi>=0.100",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
epo = "epo.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
